                            <p>抗日民主与北方青年3479（1937 年5 月15 日）</p>
                            <p>抗日要全国人民参加，没有民主则老百姓不能参加，无和平团结，无人民参加，抗战成为不可能，即战亦不能保证胜利。所以民主制度为对日抗战胜利之必要条件，非它不可。我们所以把民主问题强调起来，为的要战胜日本帝国主义。</p></div></div>
