                            <p>忆秦娥3672·娄山关3673（1935 年2 月）</p>
                            <p>西风烈，长空雁叫霜晨月。</p>
                            <p>霜晨月，马蹄声碎，喇叭声咽。</p>
                            <p>雄关漫道真如铁，而今迈步从头越。</p>
                            <p>从头越，苍山如海，残阳如血。</p>
                            <p>3672 忆秦娥：词牌名，本于李白词“秦娥梦断秦楼月”。</p></div></div>
