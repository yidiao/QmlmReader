                            <p>如梦令·元旦3665（1930 年1 月）</p>
                            <p>宁化、清流、归化，3666路隘林深苔滑。</p>
                            <p>今日向何方？</p>
                            <p>直指武夷山下。</p>
                            <p>山下，山下，风展红旗如画。</p>
                            <p>3665 这里的元旦是阴历正月初一，即阳历1930 年1 月30 日。</p>
                            <p>3666 宁化、清流、归化（今称明溪）均为闽北地名。武夷山在江西、福建边界，主峰在福建省崇安县西北。</p></div></div>
