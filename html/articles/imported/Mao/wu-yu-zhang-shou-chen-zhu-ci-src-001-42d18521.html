                            <p>吴玉章3501寿辰祝词（1940 年1 月15 日）</p>
                            <p>一个人做点好事并不难，难的是一辈。做好事，不做坏事，一贯地有益于广大群众，一贯地有益于青年，一贯地有益于革命，艰苦奋斗几十年如一日，这才是最难最难的啊！</p>
                            <p>3501 吴玉章（一八七八——一九六六），四川荣县人。当时任鲁迅艺术文学院院长、 陕甘宁边区政府文化工作委员会主任。</p></div></div>
