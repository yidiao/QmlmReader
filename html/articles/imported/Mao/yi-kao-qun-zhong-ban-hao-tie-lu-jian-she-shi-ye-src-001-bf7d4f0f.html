                            <p>依靠群众办好铁路建设事业3656（1949 年7 月9 日）</p>
                            <p>过去，我们是无产阶级，什么“产”都没有，怎么能修建铁路呢？今天，我们个人没有“产”，但我们有了国家，有了群众，有了干部，有了业程师……，只要我们依靠群众，就有力量，就能够修好铁路。</p>
                            <p>3656 这是毛泽东向全国铁路职工临时代表会议暨全国机务会议全体代表和铁道部、铁道兵团、平津铁路管理局部分工作人员的讲话。</p></div></div>
