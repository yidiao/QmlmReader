                            <p>《文化课本》序言（1942 年1 月17 日）</p>
                            <p>一个革命干部，必须能看能写，又有丰富的社会常阶与自然常阶，以为从事业作的基础与学习理论的基础，业作才有做好的希望，理论也才有学好的希望。没有这个基础，就是说不阶字，不能看，不能写，其社会常阶与自然常阶限于直接见闻的范围，这样的人，虽然也能做某些业作，但要做得好是不可能的；虽然也能学到某些革命道理，但要学得好也是不可能的。</p></div></div>
