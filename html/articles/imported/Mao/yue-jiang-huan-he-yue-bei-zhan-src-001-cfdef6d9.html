                            <p>越讲缓和越备战3368（一九七四年十二月）</p>
                            <p>越讲缓和越备战。现在可以不提当前世界主要倾向是革命，而要强调备战紧张，各国人民对此要有所准备。要弄清苏联对我试探的真正意 。如果勃列日涅夫3369和要来谈，应该怎样？（周恩来说：如他真想来谈，可考虑，但我们不能去请他。毛泽东点头。）</p>
                            <p>3368 这是毛泽东同志一九七四年十二月二十三日至二十七日在长沙听取周恩来同志等汇报四届人大筹备工作情况时讲话的节录。</p></div></div>
