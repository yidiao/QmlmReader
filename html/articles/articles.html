<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        /* qmlm:dark-mode-prerender：首帧前同步挂 dark-mode 类，防暗色用户跳转时白闪 */
        (function () {
            try {
                if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark-mode');
            } catch (e) { /* localStorage 不可用时维持白日模式 */ }
        })();
    </script>
    <title>经典著作 | 青年马列毛主义驿站</title>
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="../../favicon.ico">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/articles-index.css">
    <link rel="stylesheet" href="../../css/category-theme.css">

</head>
<body data-module="articles" data-page-type="articles" data-source="../../data/articles.json" data-view-mode="grid">
    <div id="nav-placeholder"></div>

    <main class="articles-page">
        <div class="articles-shell">
            <section class="page-hero">
                <h1 class="module-title">经典著作</h1>
                <p>革命导师的思想结晶 · 马克思主义的理论宝库</p>
                <div class="hero-stats" id="heroStats">
                    <span class="hero-stat">加载中…</span>
                </div>
            </section>

            <section class="section-box" id="collectionsSection">
                <div class="section-head">
                    <h2>主题合集</h2>
                    <div class="section-count" id="collectionCount">加载中…</div>
                </div>
                <div class="collections-grid" id="collectionsGrid"></div>
            </section>

            <section class="section-box">
                <div class="section-head">
                    <h2>筛选</h2>
                    <div class="section-count" id="articleCount">加载中…</div>
                </div>
                <div class="filter-bar" id="filterBar">
                    <input class="filter-input" id="searchInput" type="search" placeholder="搜索标题、作者、分类、关键词…">
                    <button class="filter-btn active" data-filter="priority" data-value="all">全部</button>
                    <button class="filter-btn" data-filter="priority" data-value="5">五星</button>
                    <button class="filter-btn" data-filter="priority" data-value="4">四星</button>
                    <button class="filter-btn" data-filter="priority" data-value="wip">施工中</button>
                </div>
                <div class="filter-bar" id="authorBar" style="margin-top:0.7rem;"></div>
                <div class="filter-bar" id="categoryBar" style="margin-top:0.7rem;"></div>
                <div class="filter-bar mode-switch" style="margin-top:0.7rem;">
                    <button class="filter-btn active" data-view-mode-btn="grid">卡片</button>
                    <button class="filter-btn" data-view-mode-btn="list">列表</button>
                </div>
            </section>

            <section class="section-box">
                <div class="section-head">
                    <h2>文章索引</h2>
                    <div class="section-count" id="resultCount">加载中…</div>
                </div>
                <div class="article-grid" id="articleGrid">
                    <div class="empty-state">正在加载文章索引…</div>
                </div>
            </section>
        </div>
    </main>

    <div class="modal-overlay" id="collectionModal" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-header">
                <div>
                    <h3 id="modalTitle">合集</h3>
                    <p id="modalSub"></p>
                </div>
                <button class="modal-close" id="modalClose" type="button">×</button>
            </div>
            <div class="modal-body">
                <p id="modalDesc" style="margin-top:0; color:#666;"></p>
                <div id="modalArticles"></div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <p>青年马列毛主义驿站 | Qmlm Reader</p>
            <p class="footer-note">学习他 · 成为他 · 然后超越他</p>
        </div>
    </footer>

    <script src="../../js/state-center.js"></script>
    <script src="../../js/category-theme.js"></script>
    <script src="../../js/site-data.js"></script>
    <script src="../../js/articles-index.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/darkmode.js"></script>
    <script src="../../js/preferences.js"></script>
</body>
</html>
