<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国际共运日历 | 青年马列毛主义驿站</title>
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="../../favicon.ico">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/international/international-calendar.css?v=20261101">
</head>
<body data-module="international">
    <div id="nav-placeholder"></div>

    <main class="cal-page">
        <section class="page-header">
            <h1>国际共运日历</h1>
            <p>国际共产主义运动史上的今天 | 1789–1999</p>
            <div class="cal-stats" id="calStats" aria-label="数据统计"></div>
        </section>

        <div class="calendar-layout">
            <!-- 左侧：月份导航 -->
            <aside class="month-sidebar">
                <div class="month-sidebar-head">
                    <h3>选择月份</h3>
                    <button class="btn-today" id="backTodayBtn" type="button">回到今天</button>
                </div>
                <div class="month-list" id="monthList"></div>
            </aside>

            <!-- 右侧：筛选 + 日历 -->
            <div class="calendar-content">
                <div class="cal-toolbar">
                    <div class="cal-search">
                        <input type="search" id="calSearch" placeholder="搜索事件、年份、描述…" aria-label="搜索历史事件">
                    </div>
                    <button class="btn-random" id="randomBtn" type="button" title="随机抽取一条史实">随机回眸</button>
                </div>

                <div class="filter-section" id="categoryFilters" aria-label="分类筛选"></div>
                <div class="era-section" id="eraFilters" aria-label="时代筛选"></div>

                <div class="calendar-grid">
                    <div class="weekday-header">
                        <div class="weekday">周日</div>
                        <div class="weekday">周一</div>
                        <div class="weekday">周二</div>
                        <div class="weekday">周三</div>
                        <div class="weekday">周四</div>
                        <div class="weekday">周五</div>
                        <div class="weekday">周六</div>
                    </div>
                    <div class="days-grid" id="daysGrid"></div>
                </div>
            </div>
        </div>

        <!-- 日期抽屉 -->
        <div class="popup-overlay" id="popupOverlay" hidden></div>
        <aside class="day-popup" id="dayPopup" role="dialog" aria-modal="true" aria-labelledby="popupTitle" hidden>
            <div class="popup-header">
                <div>
                    <h3 id="popupTitle">日期事件</h3>
                    <p class="popup-sub" id="popupSub"></p>
                </div>
                <button class="popup-close" id="popupClose" type="button" aria-label="关闭">×</button>
            </div>
            <div class="popup-body" id="popupBody"></div>
        </aside>

        <div class="cal-sr-only" id="calA11y" aria-live="polite"></div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>青年马列毛主义驿站 | Qmlm Reader</p>
            <p class="footer-note">学习他 · 成为他 · 然后超越他</p>
        </div>
    </footer>

    <script src="../../js/site-data.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../data/history-events.js?v=20261101"></script>
    <script src="../../js/international/international-calendar.js?v=20261101"></script>
    <script src="../../js/darkmode.js"></script>
    <script src="../../js/cursor.js"></script>
</body>
</html>
