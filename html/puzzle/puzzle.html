<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>马哲理论拼图 - 青年马列毛主义驿站</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background:  #e8ecef;
            color: #333;
        }

        .puzzle-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .puzzle-header {
            padding: 16px 24px;
            background: c0c1c3;
            border-bottom: 2px solid #c41e3a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .puzzle-header h1 {
            font-size: 1.3em;
            color: #c41e3a;
            margin: 0;
        }

        .puzzle-header p {
            font-size: 0.85em;
            color: #666;
            margin: 0;
        }

        .puzzle-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .ctrl-btn {
            background: c0c1c3;
            border: 1px solid #c41e3a;
            color: #c41e3a;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
        }
        .ctrl-btn:hover { background: #c41e3a; color: c0c1c3; }

        .puzzle-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            cursor: grab;
            background: #c0c1c3;
        }

        .puzzle-container:active { cursor: grabbing; }

        .puzzle-canvas {
            position: absolute;
            width: 2800px;
            height: 1500px;
            transform-origin: 0 0;
        }

        .tip-box {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            border: 1px solid #c41e3a;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 0.82em;
            color: #666;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255,255,255,0.95);
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 14px 18px;
            z-index: 100;
            font-size: 0.82em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .legend h4 { margin: 0 0 10px; color: #333; font-size: 0.9em; }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

        .filter-section {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
        .filter-section h4 { margin: 0 0 8px; color: #333; font-size: 0.85em; }
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .filter-btn {
            background: white;
            border: 1px solid #ccc;
            color: #666;
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.78em;
            transition: all 0.2s;
        }
        .filter-btn:hover { border-color: #999; color: #333; }
        .filter-btn.active { color: white; border-color: transparent; }
        .filter-btn[data-author="marx"] { background: #8b0000; }
        .filter-btn[data-author="lenin"] { background: #d4a017; }
        .filter-btn[data-author="stalin"] { background: #4a5568; }
        .filter-btn[data-author="mao"] { background: #c41e3a; }

        .card-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border: 2px solid #c41e3a;
            border-radius: 12px;
            padding: 28px 32px;
            max-width: 480px;
            width: 90%;
            z-index: 2000;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .card-popup.active { display: block; }

        .popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1999;
        }
        .popup-overlay.active { display: block; }

        .popup-close {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            color: #888;
            font-size: 1.4em;
            cursor: pointer;
        }
        .popup-close:hover { color: #c41e3a; }

        .popup-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.78em;
            margin-bottom: 10px;
        }

        .popup-title { font-size: 1.5em; color: #333; margin: 0 0 6px; }
        .popup-meta { color: #888; font-size: 0.85em; margin-bottom: 16px; }
        .popup-desc { color: #555; line-height: 1.8; margin-bottom: 20px; font-size: 0.95em; }
        .popup-position { background: #f8f8f8; border-radius: 6px; padding: 12px 16px; margin-bottom: 20px; font-size: 0.88em; }
        .popup-position h4 { color: #666; margin: 0 0 8px; font-size: 0.9em; }
        .popup-position p { color: #333; margin: 0; line-height: 1.7; }
        .popup-link {
            display: inline-block;
            background: #c41e3a;
            color: white;
            padding: 10px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9em;
            transition: background 0.2s;
        }
        .popup-link:hover { background: #8b0000; }

        /* SVG节点样式 */
        .node-group { cursor: pointer; }
        .node-group .node-circle { transition: filter 0.18s; }
        .node-group:hover .node-circle {
            filter: brightness(1.15) drop-shadow(0 0 6px currentColor);
        }
        .node-group.dimmed .node-circle { opacity: 0.1 !important; }
        .node-group.dimmed .node-ring { opacity: 0.05 !important; }
        .node-group.dimmed text { opacity: 0.1 !important; }

        .node-label {
            font-size: 11px;
            fill: white;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 500;
        }

        .node-year {
            font-size: 9px;
            fill: rgba(255,255,255,0.8);
            text-anchor: middle;
            pointer-events: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .lane-separator { stroke: rgba(0,0,0,0.08); stroke-width: 1; }
        .category-label { font-size: 13px; font-weight: bold; fill: currentColor; text-anchor: middle; font-family: -apple-system, sans-serif; }
        .lane-bg { opacity: 0.035; }

        /* 连线样式 */
        .line-internal { stroke-width: 1.2; stroke-dasharray: 4,4; fill: none; }
        .line-cross { stroke-width: 1.5; stroke-dasharray: 6,4; fill: none; }
        .line-major { stroke-width: 2; fill: none; }

        /* ===== 手机端适配 ===== */
        @media (max-width: 768px) {
            /* header 改为两行 */
            .puzzle-header {
                padding: 10px 14px;
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .puzzle-header h1 { font-size: 1.05em; }
            .puzzle-header p { display: none; }

            /* 控制按钮横向滚动 */
            .puzzle-controls {
                overflow-x: auto;
                white-space: nowrap;
                width: 100%;
                padding-bottom: 2px;
                scrollbar-width: none;
                gap: 6px;
            }
            .puzzle-controls::-webkit-scrollbar { display: none; }
            .ctrl-btn {
                padding: 5px 10px;
                font-size: 0.78em;
                flex-shrink: 0;
            }
            /* 隐藏"可拖拽/滚轮缩放"提示，换手机提示 */
            .puzzle-controls span {
                display: none;
            }
            .puzzle-controls::after {
                content: '👆 双指缩放 · 单指拖动';
                color: #888;
                font-size: 0.75em;
                white-space: nowrap;
                flex-shrink: 0;
                align-self: center;
            }

            /* tip 提示位置调整 */
            .tip-box {
                top: 10px;
                font-size: 0.72em;
                padding: 6px 10px;
                white-space: normal;
                text-align: center;
                max-width: 80vw;
            }

            /* 图例收起 */
            .legend {
                bottom: 10px;
                right: 10px;
                padding: 8px 12px;
                font-size: 0.75em;
                max-width: 130px;
            }
            .legend-title { font-size: 0.8em; }

            /* 筛选面板收起 */
            .filter-panel {
                bottom: 10px;
                left: 10px;
                padding: 8px 10px;
                font-size: 0.75em;
            }
            .filter-panel h4 { font-size: 0.8em; margin-bottom: 6px; }
            .filter-btn-small {
                padding: 4px 8px;
                font-size: 0.72em;
            }
        }
/* ========== 黑夜模式背景色深度优化 ========== */
/* 白天模式：略灰（更明显的灰色） */
body {
    background: #dce3e8 !important;   /* 更明显的柔和灰色，原 #f5f5f5 太白了 */
}

/* 黑夜模式：深黑但不刺眼 */
body.dark-mode {
    background: #0a0d12 !important;   /* 极深灰黑，不是纯黑 #000，保留一点质感 */
}

/* 拼图容器背景（中间那块大区域） */
.puzzle-container {
    background: #ffffff;   /* 白天保持白色 */
}

body.dark-mode .puzzle-container {
    background: #0f1117 !important;   /* 深色背景，与外围协调 */
}

/* 顶部 header 区域 */
.puzzle-header {
    background: white;
    transition: background 0.2s;
}

body.dark-mode .puzzle-header {
    background: #141822 !important;   /* 深色 header */
    border-bottom-color: #8b2c2c;
}

body.dark-mode .puzzle-header h1 {
    color: #e05a5a;   /* 标题红色在黑夜模式下稍微柔和 */
}

body.dark-mode .puzzle-header p {
    color: #9aa3b8;
}

/* 控制按钮黑夜模式适配 */
body.dark-mode .ctrl-btn {
    background: #1e2432;
    border-color: #8b2c2c;
    color: #e05a5a;
}

body.dark-mode .ctrl-btn:hover {
    background: #8b2c2c;
    color: white;
}

/* 图例面板黑夜模式 */
body.dark-mode .legend {
    background: rgba(20, 24, 34, 0.95);
    border-color: #2a2f3f;
    color: #ddd;
}

body.dark-mode .legend h4 {
    color: #e0e0e0;
}

/* 提示框黑夜模式 */
body.dark-mode .tip-box {
    background: rgba(20, 24, 34, 0.95);
    border-color: #8b2c2c;
    color: #bbb;
}

/* 筛选按钮黑夜模式 */
body.dark-mode .filter-btn {
    background: #252c3d;
    border-color: #3a4158;
    color: #ccc;
}

body.dark-mode .filter-btn:hover {
    border-color: #e05a5a;
    color: #fff;
}
    </style>
</head>

    <div class="puzzle-page">
        <div class="puzzle-header">
            <div>
                <h1>☭ 马哲理论拼图</h1>
                <p>从《共产党宣言》到《实践论》——点击查看马克思主义发展脉络</p>
            </div>
            <div class="puzzle-controls">
                <button class="ctrl-btn" onclick="zoomIn()">＋ 放大</button>
                <button class="ctrl-btn" onclick="zoomOut()">－ 缩小</button>
                <button class="ctrl-btn" onclick="resetView()">⊙ 重置</button>
                <button class="ctrl-btn" onclick="resetFilter()">⊚ 清除筛选</button>
                <span style="color:#888;font-size:0.85em;">可拖拽 / 滚轮缩放</span>
            </div>
        </div>

        <div class="puzzle-container" id="puzzleContainer">
            
            <div class="puzzle-canvas" id="puzzleCanvas">
                <svg width="2800" height="1500" id="puzzleSvg">
                    <!-- 细密方格网 -->
                    <defs>
                        <pattern id="gridFine" width="25" height="25" patternUnits="userSpaceOnUse">
                            <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(180,180,180,0.08)" stroke-width="0.5"/>
                        </pattern>
                        <pattern id="gridMain" width="100" height="100" patternUnits="userSpaceOnUse">
                            <rect width="100" height="100" fill="url(#gridFine)"/>
                            <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(150,150,150,0.12)" stroke-width="0.6"/>
                        </pattern>
                    </defs>
                    <rect width="2800" height="1500" fill="url(#gridMain)"/>

                    <!-- 泳道背景 -->
                    <rect x="80" y="150" width="400" height="1200" class="lane-bg" fill="#c41e3a"/>
                    <rect x="480" y="150" width="400" height="1200" class="lane-bg" fill="#e65100"/>
                    <rect x="880" y="150" width="400" height="1200" class="lane-bg" fill="#805ad5"/>
                    <rect x="1280" y="150" width="400" height="1200" class="lane-bg" fill="#38a169"/>
                    <rect x="1680" y="150" width="400" height="1200" class="lane-bg" fill="#3182ce"/>
                    <rect x="2080" y="150" width="400" height="1200" class="lane-bg" fill="#00695c"/>

                    <!-- 泳道分隔线 -->
                    <line x1="480" y1="130" x2="480" y2="1370" class="lane-separator"/>
                    <line x1="880" y1="130" x2="880" y2="1370" class="lane-separator"/>
                    <line x1="1280" y1="130" x2="1280" y2="1370" class="lane-separator"/>
                    <line x1="1680" y1="130" x2="1680" y2="1370" class="lane-separator"/>
                    <line x1="2080" y1="130" x2="2080" y2="1370" class="lane-separator"/>

                    <!-- 类别标题 -->
                    <text x="280" y="152" class="category-label" fill="#c41e3a">哲学基础</text>
                    <text x="680" y="152" class="category-label" fill="#e65100">政治经济学</text>
                    <text x="1080" y="152" class="category-label" fill="#805ad5">政治理论</text>
                    <text x="1480" y="152" class="category-label" fill="#38a169">党的建设</text>
                    <text x="1880" y="152" class="category-label" fill="#3182ce">军事战略</text>
                    <text x="2280" y="152" class="category-label" fill="#00695c">思想文化</text>

                    <!-- Y轴时间刻度 (线性映射: Y=180+(year-1848)*10.5) -->
                    <!-- SVG可用高度1500, 数据范围1844-1957, 间距~10.5px/年 -->
                    <line x1="55" y1="155" x2="55" y2="1340" stroke="#bbb" stroke-width="1.2" opacity="0.4"/>

                    <!-- === 第一期: 马克思早期思想形成 (1844-1848) === -->
                    <circle cx="55" cy="159" r="2" fill="#888" opacity="0.5"/>
                    <text x="45" y="163" text-anchor="end" font-size="8" fill="#888">1844</text>
                    <!-- 1848 - 共产党宣言 -->
                    <circle cx="55" cy="190" r="3" fill="#c41e3a" opacity="0.6"/>
                    <text x="45" y="194" text-anchor="end" font-size="10" fill="#c41e3a">1848</text>
                    <text x="30" y="180" text-anchor="end" font-size="6.5" fill="#888" opacity="0.6">(早期思想)</text>

                    <!-- === 第二期: 马恩成熟期 (1867-1884) === -->
                    <circle cx="55" cy="380" r="2" fill="#888" opacity="0.5"/>
                    <text x="45" y="384" text-anchor="end" font-size="9" fill="#888">1867</text>
                    <circle cx="55" cy="464" r="2.5" fill="#888" opacity="0.5"/>
                    <text x="45" y="468" text-anchor="end" font-size="10" fill="#888">1875</text>
                    <text x="30" y="430" text-anchor="end" font-size="6.5" fill="#888" opacity="0.6">(马恩成熟期)</text>

                    <!-- === 第三期: 恩格斯晚期 / 列宁主义前夜 (1884-1902) === -->
                    <circle cx="55" cy="558" r="2" fill="#888" opacity="0.4"/>
                    <text x="45" y="562" text-anchor="end" font-size="8" fill="#888">1884</text>
                    <circle cx="55" cy="726" r="2.5" fill="#888" opacity="0.5"/>
                    <text x="45" y="730" text-anchor="end" font-size="10" fill="#888">1900</text>
                    <text x="30" y="655" text-anchor="end" font-size="6.5" fill="#888" opacity="0.6">(恩格斯晚期)</text>

                    <!-- === 第四期: 列宁主义哲学 (1902-1917) === -->
                    <circle cx="55" cy="747" r="2" fill="#888" opacity="0.5"/>
                    <text x="45" y="751" text-anchor="end" font-size="8" fill="#888">1902</text>
                    <circle cx="55" cy="821" r="2" fill="#888" opacity="0.4"/>
                    <text x="45" y="825" text-anchor="end" font-size="8" fill="#888">1909</text>
                    <circle cx="55" cy="905" r="2" fill="#888" opacity="0.5"/>
                    <text x="45" y="909" text-anchor="end" font-size="8" fill="#888">1917</text>
                    <text x="30" y="835" text-anchor="end" font-size="6.5" fill="#888" opacity="0.6">(列宁主义)</text>

                    <!-- === 第五期: 苏联建设 & 中国革命早期 (1917-1930) === -->
                    <circle cx="55" cy="989" r="2" fill="#888" opacity="0.5"/>
                    <text x="45" y="993" text-anchor="end" font-size="9" fill="#888">1925</text>
                    <circle cx="55" cy="1041" r="2" fill="#888" opacity="0.4"/>
                    <text x="45" y="1045" text-anchor="end" font-size="8" fill="#888">1930</text>
                    <text x="30" y="1020" text-anchor="end" font-size="6.5" fill="#888" opacity="0.6">(苏联建设)</text>

                    <!-- === 第六期: 毛泽东哲学 & 战争时期 (1930-1949) === -->
                    <circle cx="55" cy="1115" r="3" fill="#c41e3a" opacity="0.6"/>
                    <text x="45" y="1119" text-anchor="end" font-size="10" fill="#c41e3a">1937</text>
                    <circle cx="55" cy="1188" r="2" fill="#888" opacity="0.4"/>
                    <text x="45" y="1192" text-anchor="end" font-size="8" fill="#888">1944</text>
                    <text x="30" y="1158" text-anchor="end" font-size="6.5" fill="#888" opacity="0.6">(战争时期)</text>

                    <!-- === 第七期: 建国后建设期 (1949-1957) === -->
                    <circle cx="55" cy="1251" r="2.5" fill="#888" opacity="0.5"/>
                    <text x="45" y="1255" text-anchor="end" font-size="10" fill="#888">1950</text>
                    <text x="30" y="1295" text-anchor="end" font-size="6.5" fill="#888" opacity="0.6">(建国后)</text>

                    <!-- ===== 哲学基础 ==== -->
                    <!-- 线性Y公式: Y=180+(year-1848)*10.5 -->
                    <!-- 1844前节点挤在上方155-190区间(每年约8-10px) -->
                    <!-- 1844=158, 1845=170, 1846=178, 1848=190, 1867=380, 1875=464, 1878=495, 1884=558, 1902=747, 1909=821, 1916=894, 1917=905, 1924=978, 1930=1041, 1937=1115, 1939=1140, 1944=1188, 1957=1325 -->

                    <!-- 内部曲线 — 1844-1848密集簇 -->
                    <!-- 黑格尔批判(150,158) → 1844手稿(280,162) -->
                    <path d="M 150 158 C 200 159, 240 161, 280 162" class="line-internal" stroke="#c41e3a" opacity="0.08"/>
                    <!-- 1844手稿(280,162) → 费尔巴哈(400,170) -->
                    <path d="M 280 162 C 320 165, 360 168, 400 170" class="line-internal" stroke="#c41e3a" opacity="0.08"/>
                    <!-- 黑格尔批判(150,158) → 德意志意识形态(350,178) -->
                    <path d="M 150 158 C 220 165, 300 174, 350 178" class="line-internal" stroke="#c41e3a" opacity="0.08"/>
                    <!-- 费尔巴哈(400,170) → 德意志意识形态(350,178) -->
                    <path d="M 400 170 C 380 173, 365 176, 350 178" class="line-internal" stroke="#c41e3a" opacity="0.06"/>
                    <!-- 德意志意识形态(350,178) → 共宣(178,190) -->
                    <path d="M 350 178 C 280 183, 210 188, 178 190" class="line-internal" stroke="#c41e3a" opacity="0.1"/>
                    <!-- 共宣(178,190) → 资本论(278,380) 跨19年 -->

        function showCard(id) {
            const a = articles[id];
            if (!a) return;
            document.getElementById('popupTitle').textContent = a.title;
            document.getElementById('popupMeta').textContent = a.meta;
            document.getElementById('popupDesc').textContent = a.desc;
            document.getElementById('popupPosition').textContent = a.position;
            const badge = document.getElementById('popupBadge');
            badge.textContent = a.badge + ' ' + (a.stars || '');
            badge.style.background = a.badgeColor + '22';
            badge.style.color = a.badgeColor;
            badge.style.border = '1px solid ' + a.badgeColor;
            const popupLink = document.getElementById('popupLink');
            const isWip = a.link && a.link.includes('javascript:alert');
            if (isWip) {
                popupLink.href = '#';
                popupLink.onclick = function(e) { e.preventDefault(); alert('🚧 正在施工，敬请期待！'); return false; };
                popupLink.textContent = '🚧 正在施工';
                popupLink.style.background = '#888';
                popupLink.style.cursor = 'default';
            } else {
                popupLink.href = a.link;
                popupLink.onclick = null;
                popupLink.textContent = '→ 进入精读';
                popupLink.style.background = '#c41e3a';
                popupLink.style.cursor = 'pointer';
            }
            document.getElementById('cardPopup').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }

        function closeCard() {
            document.getElementById('cardPopup').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        let currentFilter = null;

        function filterByAuthor(author) {
            const buttons = document.querySelectorAll('.filter-btn');
            const nodes = document.querySelectorAll('.node-group');
            if (currentFilter === author) {
                currentFilter = null;
                buttons.forEach(btn => btn.classList.remove('active'));
                nodes.forEach(node => node.classList.remove('dimmed'));
            } else {
                currentFilter = author;
                buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.author === author));
                nodes.forEach(node => node.classList.toggle('dimmed', node.dataset.author !== author));
            }
        }

        function resetFilter() {
            currentFilter = null;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.node-group').forEach(node => node.classList.remove('dimmed'));
        }

        const container = document.getElementById('puzzleContainer');
        const canvas = document.getElementById('puzzleCanvas');
        let scale = 0.45;
        let translateX = 0, translateY = 20;
        let isDragging = false, startX, startY, startTX, startTY;

        function applyTransform() {
            canvas.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }
        applyTransform();

        container.addEventListener('mousedown', e => {
            if (e.target.closest('.node-group')) return;
            isDragging = true;
            startX = e.clientX; startY = e.clientY;
            startTX = translateX; startTY = translateY;
            e.preventDefault();
        });
        document.addEventListener('mousemove', e => {
            if (!isDragging) return;
            translateX = startTX + (e.clientX - startX);
            translateY = startTY + (e.clientY - startY);
            applyTransform();
        });
        document.addEventListener('mouseup', () => isDragging = false);
        container.addEventListener('wheel', e => {
            e.preventDefault();
            scale = Math.max(0.2, Math.min(2, scale + (e.deltaY > 0 ? -0.05 : 0.05)));
            applyTransform();
        }, { passive: false });

        let lastTouchDist = null;
        container.addEventListener('touchstart', e => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX; startY = e.touches[0].clientY;
                startTX = translateX; startTY = translateY;
            }
        });
        container.addEventListener('touchmove', e => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                translateX = startTX + (e.touches[0].clientX - startX);
                translateY = startTY + (e.touches[0].clientY - startY);
                applyTransform();
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                if (lastTouchDist) {
                    scale = Math.max(0.2, Math.min(2, scale * (dist / lastTouchDist)));
                    applyTransform();
                }
                lastTouchDist = dist;
            }
        }, { passive: false });
        container.addEventListener('touchend', () => { isDragging = false; lastTouchDist = null; });

        function zoomIn() { scale = Math.min(2, scale + 0.1); applyTransform(); }
        function zoomOut() { scale = Math.max(0.2, scale - 0.1); applyTransform(); }
        function resetView() { scale = 0.45; translateX = 0; translateY = 20; applyTransform(); }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode') ? 'true' : 'false');
            document.querySelector('.dark-mode-toggle').textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        }
        if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');
    </script>

<script>
// 汉堡菜单
(function() {
    document.addEventListener('DOMContentLoaded', function() {
        var hamburger = document.querySelector('.hamburger-btn');
        var nav = document.querySelector('.main-nav');
        var closeBtn = document.querySelector('.nav-close-btn');
        
        if (!hamburger || !nav) return;
        
        // 打开菜单
        function openMenu() {
            nav.classList.add('open');
            hamburger.classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        
        // 关闭菜单
        function closeMenu() {
            nav.classList.remove('open');
            hamburger.classList.remove('open');
            document.body.style.overflow = '';
        }
        
        // 汉堡按钮点击
        hamburger.addEventListener('click', function(e) {
            e.stopPropagation();
            if (nav.classList.contains('open')) {
                closeMenu();
            } else {
                openMenu();
            }
        });
        
        // 叉号按钮点击
        if (closeBtn) {
            closeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                closeMenu();
            });
        }
        
        // 点击导航链接后关闭菜单
        nav.querySelectorAll('a').forEach(function(link) {
            link.addEventListener('click', function() {
                closeMenu();
            });
        });
        
        // 点击页面其他区域关闭菜单
        document.addEventListener('click', function(e) {
            if (nav.classList.contains('open') && !nav.contains(e.target) && e.target !== hamburger && e.target !== closeBtn) {
                closeMenu();
            }
        });
        
        // ESC 键关闭菜单
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && nav.classList.contains('open')) {
                closeMenu();
            }
        });
    });
})();</script>
