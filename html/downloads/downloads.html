<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下载中心 | 青年马列毛主义驿站</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* ===== 下载中心标题：资料档案风格 ===== */
        .page-header {
            position: relative;
            max-width: 1100px;
            margin: 28px auto 36px;
            padding: 48px 44px 44px;
            overflow: hidden;
            background: #102a2a;
            color: #f3ead7;
            text-align: left;
            border-left: 6px solid #d6a756;
        }
        .page-header::before {
            content: '';
            position: absolute;
            top: -30%;
            right: 8%;
            width: 180px;
            height: 170%;
            background: #54b3a5;
            opacity: 0.18;
            transform: rotate(18deg);
            pointer-events: none;
        }
        .page-header::after {
            content: '';
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            height: 4px;
            background: #d6a756;
        }
        .page-header-badge {
            position: relative;
            z-index: 1;
            display: inline-block;
            margin-bottom: 18px;
            padding: 3px 14px;
            border: 2px solid #54b3a5;
            color: #73d1c2;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 4px;
        }
        .page-header h1 {
            position: relative;
            z-index: 1;
            margin: 0 0 12px;
            color: #f3ead7;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 6px;
        }
        .page-header h1 span { color: #f0c56e; }
        .page-header p {
            position: relative;
            z-index: 1;
            max-width: 560px;
            margin: 0;
            color: #b8c9c2;
            font-size: 0.9rem;
            line-height: 1.7;
        }
        body.dark-mode .page-header { background: #091c1c; }
        @media (max-width: 768px) {
            .page-header { margin: 20px 0 24px; padding: 32px 20px; }
            .page-header h1 { font-size: 1.8rem; letter-spacing: 3px; }
        }
        .dl-container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .dl-stats { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 2rem; }
        .dl-stat {
            flex: 1; min-width: 140px; background: var(--card-bg); border-radius: 10px;
            padding: 1rem 1.25rem; box-shadow: var(--shadow); text-align: center; border-top: 3px solid #1f6f8b;
        }
        .dl-stat .num { font-size: 1.8rem; font-weight: 700; color: #1a5276; }
        .dl-stat .lbl { font-size: 0.85rem; color: var(--text-light); margin-top: 0.15rem; }
        .dl-filters { display: flex; gap: 0.6rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .dl-filter-btn {
            padding: 0.45rem 1rem; border: 2px solid #e0e0e0; background: white; border-radius: 20px;
            cursor: pointer; font-size: 0.88rem; transition: all 0.2s;
        }
        .dl-filter-btn:hover, .dl-filter-btn.active { background: #1a5276; border-color: #1a5276; color: white; }
        .dl-section { margin-bottom: 2.5rem; }
        .dl-section-title {
            font-size: 1.3rem; font-weight: 700; margin-bottom: 1rem; padding-bottom: 0.5rem;
            border-bottom: 2px solid #1f6f8b; display: flex; align-items: center; gap: 0.5rem;
        }
        .dl-section-count { font-size: 0.85rem; font-weight: 400; color: var(--text-light); margin-left: auto; }
        .dl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; }
        .dl-card {
            background: var(--card-bg); border-radius: 10px; padding: 1rem 1.25rem; box-shadow: var(--shadow);
            display: flex; align-items: center; gap: 1rem; transition: transform 0.2s, box-shadow 0.2s; border-left: 4px solid #ddd;
        }
        .dl-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
        .dl-card.cat-mao    { border-left-color: #c41e3a; }
        .dl-card.cat-marx   { border-left-color: #8b0000; }
        .dl-card.cat-lenin  { border-left-color: #d4a017; }
        .dl-card.cat-stalin { border-left-color: #744210; }
        .dl-card.cat-engels { border-left-color: #4a5568; }
        .dl-card.cat-rectify{ border-left-color: #6b2fa0; }
        .dl-card.cat-posters{ border-left-color: #e65100; }
        .dl-icon { font-size: 1.6rem; flex-shrink: 0; width: 40px; text-align: center; }
        .dl-info { flex: 1; min-width: 0; }
        .dl-info .dl-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 0.2rem; color: var(--text-color); }
        .dl-info .dl-meta {
            font-size: 0.8rem; color: var(--text-light); display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center;
        }
        .dl-badge { display: inline-block; padding: 0.1rem 0.45rem; border-radius: 8px; font-size: 0.72rem; font-weight: 600; }
        .badge-zip  { background: #fce7f3; color: #9d174d; }
        .badge-txt  { background: #e0e7ff; color: #3730a3; }
        .badge-size { background: #f3f4f6; color: #6b7280; }
        .dl-btn {
            flex-shrink: 0; padding: 0.45rem 1rem; background: #1a5276; color: white; text-decoration: none;
            border-radius: 6px; font-size: 0.85rem; font-weight: 600; transition: background 0.2s; white-space: nowrap; border: none; cursor: pointer;
        }
        .dl-btn:hover { background: #1f6f8b; }
        .dl-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center;
            z-index: 9999; padding: 1rem;
        }
        .dl-modal.show { display: flex; }
        .dl-modal-card { width: min(460px, 100%); background: var(--card-bg); border-radius: 14px; box-shadow: var(--shadow-hover); padding: 1.2rem; }
        .dl-modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.4rem; }
        .dl-modal-meta { color: var(--text-light); font-size: 0.88rem; margin-bottom: 1rem; }
        .dl-modal-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .dl-modal-close { margin-top: 0.9rem; background: transparent; border: none; color: var(--text-light); cursor: pointer; padding: 0; }
        body.dark-mode .dl-filter-btn { background: #3a3a3a; border-color: #555; color: #ddd; }
        body.dark-mode .dl-filter-btn:hover, body.dark-mode .dl-filter-btn.active { background: #1a5276; border-color: #1a5276; }
        body.dark-mode .badge-zip  { background: #3d1a2e; color: #f472b6; }
        body.dark-mode .badge-txt  { background: #1e2440; color: #a5b4fc; }
        body.dark-mode .badge-size { background: #333; color: #aaa; }
        @media (max-width: 768px) {
            .dl-grid { grid-template-columns: 1fr; }
            .page-header h1 { font-size: 1.8rem; }
            .dl-stats { gap: 0.75rem; }
            .dl-stat { min-width: 80px; padding: 0.75rem; }
            .dl-stat .num { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <main>
        <section class="page-header">
            <div class="page-header-badge">RESOURCE ARCHIVE</div>
            <h1><span>下载</span>中心</h1>
            <p>经典著作与专题文章统一导出为 TXT / DOCX，宣传画资源继续集中收纳</p>
        </section>

        <div class="dl-container">
            <div class="dl-stats">
                <div class="dl-stat"><div class="num" id="countArticles">0</div><div class="lbl">经典著作</div></div>
                <div class="dl-stat"><div class="num" id="countRectify">0</div><div class="lbl">专题文章</div></div>
                <div class="dl-stat"><div class="num" id="countZip">0</div><div class="lbl">宣传画图包 ZIP</div></div>
                <div class="dl-stat"><div class="num" id="countTotal">0</div><div class="lbl">全部资源</div></div>
            </div>

            <div class="dl-filters">
                <button class="dl-filter-btn active" data-filter="all">全部</button>
                <button class="dl-filter-btn" data-filter="mao">毛泽东</button>
                <button class="dl-filter-btn" data-filter="marx">马克思</button>
                <button class="dl-filter-btn" data-filter="lenin">列宁</button>
                <button class="dl-filter-btn" data-filter="stalin">斯大林</button>
                <button class="dl-filter-btn" data-filter="rectify">正名</button>
                <button class="dl-filter-btn" data-filter="posters">宣传画</button>
            </div>

            <section class="dl-section" data-section="articles">
                <div class="dl-section-title">
                     经典著作
                    <span class="dl-section-count" id="articlesSectionCount">0 篇</span>
                </div>
                <div class="dl-grid" id="articlesGrid"></div>
            </section>

            <section class="dl-section" data-section="rectify">
                <div class="dl-section-title">
                     专题文章
                    <span class="dl-section-count" id="rectifySectionCount">0 篇</span>
                </div>
                <div class="dl-grid" id="rectifyGrid"></div>
            </section>

            <section class="dl-section" data-section="posters">
                <div class="dl-section-title">
                     宣传画网盘链接
                    <span class="dl-section-count" id="postersSectionCount">0 项</span>
                </div>
                <div class="dl-grid" id="postersGrid"></div>
            </section>
        </div>
    </main>

    <div class="dl-modal" id="downloadChoiceModal">
        <div class="dl-modal-card">
            <div class="dl-modal-title" id="downloadChoiceTitle">选择下载格式</div>
            <div class="dl-modal-meta" id="downloadChoiceMeta"></div>
            <div class="dl-modal-actions">
                <button class="dl-btn" id="downloadTxtBtn" type="button">下载 TXT</button>
                <button class="dl-btn" id="downloadDocxBtn" type="button">下载 DOCX</button>
            </div>
            <button class="dl-modal-close" id="downloadChoiceClose" type="button">关闭</button>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <p>青年马列毛主义驿站 | Qmlm Reader</p>
            <p class="footer-note">学习他 · 成为他 · 然后超越他</p>
        </div>
    </footer>

    <script src="../../js/download-export.js"></script>
    <script src="../../js/site-data.js"></script>
    <script src="../../js/state-center.js"></script>
    <script src="../../js/page-state-adapter.js"></script>
    <script src="../../js/main.js"></script>
    <script>
    var downloadData = (window.SITE_DATA && window.SITE_DATA.downloadData) || { articles: [], rectify: [], posters: [] };
    var articleDocs = downloadData.articles || [];
    var rectifyDocs = downloadData.rectify || [];
    var posterZIPs = downloadData.posters || [];
    var currentDownloadItem = null;
    var authorIcons = { mao: '', marx: '', lenin: '', stalin: '', engels: '', rectify: '', posters: '' };

    function patchDownloadsState(patch) {
        if (window.QMLMPageState && typeof window.QMLMPageState.patch === 'function') {
            window.QMLMPageState.patch('pageDownloads', patch, 'downloads-page');
        }
    }

    function applyDownloadFilter(filter) {
        filter = filter || 'all';
        document.querySelectorAll('.dl-filter-btn').forEach(function(b) {
            b.classList.toggle('active', b.dataset.filter === filter);
        });
        document.querySelectorAll('.dl-card').forEach(function(card) {
            card.style.display = (filter === 'all' || card.dataset.cat === filter) ? 'flex' : 'none';
        });
        document.querySelectorAll('.dl-section').forEach(function(sec) {
            var cards = sec.querySelectorAll('.dl-card');
            var anyVisible = false;
            cards.forEach(function(c) { if (c.style.display !== 'none') anyVisible = true; });
            sec.style.display = anyVisible || filter === 'all' ? 'block' : 'none';
        });
    }

    function publishDownloadChoice(open, item, metaText) {
        patchDownloadsState({
            filter: getActiveDownloadFilter(),
            choiceModal: {
                open: !!open,
                slug: item && item.slug || '',
                title: item && item.title || '',
                meta: metaText || ''
            }
        });
    }

    function getActiveDownloadFilter() {
        var active = document.querySelector('.dl-filter-btn.active');
        return active && active.dataset ? active.dataset.filter || 'all' : 'all';
    }

    function findDownloadItem(slug) {
        var allItems = articleDocs.concat(rectifyDocs);
        for (var i = 0; i < allItems.length; i++) {
            if (allItems[i] && allItems[i].slug === slug) return allItems[i];
        }
        return null;
    }

    function applyDownloadChoiceState(modalState) {
        var modal = document.getElementById('downloadChoiceModal');
        if (!modalState || !modalState.open) {
            currentDownloadItem = null;
            if (modal) modal.classList.remove('show');
            return;
        }
        var item = findDownloadItem(modalState.slug);
        if (!item) return;
        currentDownloadItem = item;
        document.getElementById('downloadChoiceTitle').textContent = modalState.title || item.title;
        document.getElementById('downloadChoiceMeta').textContent = modalState.meta || '';
        if (modal) modal.classList.add('show');
    }

    function esc(s) {
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(s || ''));
        return d.innerHTML;
    }

    function articleHtmlPath(item) {
        return '../../html/' + item.file;
    }

    function openDownloadChoice(item, metaText) {
        currentDownloadItem = item;
        document.getElementById('downloadChoiceTitle').textContent = item.title;
        document.getElementById('downloadChoiceMeta').textContent = metaText || '';
        document.getElementById('downloadChoiceModal').classList.add('show');
        publishDownloadChoice(true, item, metaText);
    }

    function closeDownloadChoice() {
        currentDownloadItem = null;
        document.getElementById('downloadChoiceModal').classList.remove('show');
        publishDownloadChoice(false, null, '');
    }

    function renderArticleCard(item) {
        return '<div class="dl-card cat-' + item.cat + '" data-cat="' + item.cat + '">' +
            '<div class="dl-icon">' + (authorIcons[item.cat] || '') + '</div>' +
            '<div class="dl-info">' +
                '<div class="dl-title">' + esc(item.title) + '</div>' +
                '<div class="dl-meta">' +
                    '<span>' + esc(item.author) + '</span>' +
                    '<span>' + esc(String(item.year || '')) + '</span>' +
                    '<span class="dl-badge badge-txt">TXT / DOCX</span>' +
                '</div>' +
            '</div>' +
            '<button class="dl-btn" type="button" data-download-kind="article" data-slug="' + esc(item.slug) + '">下载</button>' +
        '</div>';
    }

    function renderRectifyCard(item) {
        return '<div class="dl-card cat-rectify" data-cat="rectify">' +
            '<div class="dl-icon"></div>' +
            '<div class="dl-info">' +
                '<div class="dl-title">' + esc(item.title) + '</div>' +
                '<div class="dl-meta">' +
                    '<span>专题 · ' + esc(item.section) + '</span>' +
                    '<span class="dl-badge badge-txt">TXT / DOCX</span>' +
                '</div>' +
            '</div>' +
            '<button class="dl-btn" type="button" data-download-kind="rectify" data-slug="' + esc(item.slug) + '">下载</button>' +
        '</div>';
    }

    function renderPosterCard(item) {
        return '<div class="dl-card cat-posters" data-cat="posters">' +
            '<div class="dl-icon"></div>' +
            '<div class="dl-info">' +
                '<div class="dl-title">' + esc(item.label) + '</div>' +
                '<div class="dl-meta">' +
                    '<span class="dl-badge badge-zip">' + (item.link ? '网盘外链' : 'ZIP') + '</span>' +
                    '<span class="dl-badge badge-size">' + esc(item.size) + '</span>' +
                '</div>' +
            '</div>' +
            '<a class="dl-btn" href="' + esc(item.link || ('../../downloads/posters/' + item.file)) + '" target="_blank" rel="noopener">打开</a>' +
        '</div>';
    }

    function bindDownloadButtons() {
        document.querySelectorAll('[data-download-kind]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var kind = btn.getAttribute('data-download-kind');
                var slug = btn.getAttribute('data-slug');
                var list = kind === 'rectify' ? rectifyDocs : articleDocs;
                var item = list.find(function(x) { return x.slug === slug; });
                if (!item) return;
                var meta = kind === 'rectify'
                    ? ('专题文章 · ' + (item.section || 'rectify'))
                    : ((item.author || '') + (item.year ? ' · ' + item.year : ''));
                openDownloadChoice(item, meta);
            });
        });
    }

    document.getElementById('articlesGrid').innerHTML = articleDocs.map(renderArticleCard).join('');
    document.getElementById('rectifyGrid').innerHTML = rectifyDocs.map(renderRectifyCard).join('');
    document.getElementById('postersGrid').innerHTML = posterZIPs.map(renderPosterCard).join('');
    bindDownloadButtons();

    document.getElementById('countArticles').textContent = articleDocs.length;
    document.getElementById('countRectify').textContent = rectifyDocs.length;
    document.getElementById('countZip').textContent = posterZIPs.length;
    document.getElementById('countTotal').textContent = articleDocs.length + rectifyDocs.length + posterZIPs.length;
    document.getElementById('articlesSectionCount').textContent = articleDocs.length + ' 篇';
    document.getElementById('rectifySectionCount').textContent = rectifyDocs.length + ' 篇';
    document.getElementById('postersSectionCount').textContent = posterZIPs.length + ' 项';

    document.getElementById('downloadChoiceClose').addEventListener('click', closeDownloadChoice);
    document.getElementById('downloadChoiceModal').addEventListener('click', function(e) {
        if (e.target === this) closeDownloadChoice();
    });
    document.getElementById('downloadTxtBtn').addEventListener('click', async function() {
        if (!currentDownloadItem) return;
        try {
            var payload = await window.DownloadExport.fetchArticlePayload(articleHtmlPath(currentDownloadItem), currentDownloadItem.title);
            await window.DownloadExport.downloadArticleAsTxt(payload);
            closeDownloadChoice();
        } catch (err) {
            alert(err && err.message ? err.message : '下载失败');
        }
    });
    document.getElementById('downloadDocxBtn').addEventListener('click', async function() {
        if (!currentDownloadItem) return;
        try {
            var payload = await window.DownloadExport.fetchArticlePayload(articleHtmlPath(currentDownloadItem), currentDownloadItem.title);
            await window.DownloadExport.downloadArticleAsDocx(payload);
            closeDownloadChoice();
        } catch (err) {
            alert(err && err.message ? err.message : '下载失败');
        }
    });

    document.querySelectorAll('.dl-filter-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var filter = this.dataset.filter || 'all';
            applyDownloadFilter(filter);
            patchDownloadsState({ filter: filter });
        });
    });

    if (window.QMLMPageState && typeof window.QMLMPageState.subscribe === 'function') {
        var initialDownloadsState = window.QMLMPageState.get('pageDownloads') || {};
        if (initialDownloadsState.filter) applyDownloadFilter(initialDownloadsState.filter);
        if (initialDownloadsState.choiceModal) applyDownloadChoiceState(initialDownloadsState.choiceModal);
        window.QMLMPageState.subscribe('pageDownloads.filter', function(filter) {
            if (filter) applyDownloadFilter(filter);
        });
        window.QMLMPageState.subscribe('pageDownloads.choiceModal', function(modalState, rootState, meta) {
            if (meta && meta.source === 'downloads-page') return;
            applyDownloadChoiceState(modalState);
        });
    }
    </script>
    <script src="../../js/darkmode.js"></script>
    <script src="../../js/cursor.js"></script>
</body>
</html>
