<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        /* qmlm:dark-mode-prerender：首帧前同步挂 dark-mode 类，防暗色用户跳转时白闪 */
        (function () {
            try {
                if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark-mode');
            } catch (e) { /* localStorage 不可用时维持白日模式 */ }
        })();
    </script>
    <title>个人偏好 | 青年马列毛主义驿站</title>
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="../../favicon.ico">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/preferences/preferences.css">
</head>
<body data-module="preferences">
    <div id="nav-placeholder"></div>

    <main class="prefs-page">
        <section class="prefs-hero">
            <div class="container">
                <div>
                    <div class="prefs-badge">注意，仅本地浏览器可见，迁移需导出json</div>
                    <h1 class="module-title">个人偏好</h1>
                    <p>收藏、阅读历史、视图设置与本地数据管理，统一收纳在这里。左侧切换分类，右侧以卡片方式展示内容，操作更顺手也更清晰。</p>
                    <div class="prefs-hero-cta">
                        <a class="prefs-btn secondary" href="../index.html">返回首页</a>
                        <a class="prefs-btn secondary" href="../articles/articles.html">前往文章</a>
                    </div>
                </div>
            </div>
        </section>

        <div class="prefs-container">
            <div class="prefs-summary">
                <div class="prefs-stat">
                    <div class="prefs-stat-label">收藏</div>
                    <div class="prefs-stat-value" id="favoriteCount">0</div>
                    <div class="prefs-stat-desc">当前浏览器保存的文章收藏</div>
                </div>
                <div class="prefs-stat">
                    <div class="prefs-stat-label">历史</div>
                    <div class="prefs-stat-value" id="historyCount">0</div>
                    <div class="prefs-stat-desc">最近阅读与继续阅读记录</div>
                </div>
                <div class="prefs-stat">
                    <div class="prefs-stat-label">视图</div>
                    <div class="prefs-stat-value" id="viewModeLabel">卡片</div>
                    <div class="prefs-stat-desc" id="densityLabel">标准密度</div>
                </div>
                <div class="prefs-stat">
                    <div class="prefs-stat-label">数据</div>
                    <div class="prefs-stat-value" id="dataStateLabel">本地</div>
                    <div class="prefs-stat-desc">支持导出 / 导入 / 重置</div>
                </div>
            </div>

            <div class="prefs-shell">
                <aside class="prefs-sidebar">
                    <div class="prefs-sidebar-top">
                        <div class="prefs-sidebar-kicker">导航</div>
                        <div class="prefs-sidebar-title">查看偏好</div>
                        <div class="prefs-sidebar-desc">点击左侧即可切换右侧内容，收藏、历史和设置都会以卡片方式刷新展示。</div>
                    </div>
                    <nav class="prefs-nav" aria-label="偏好分类导航">
                        <button class="prefs-nav-item active" type="button" data-prefs-section="favorites">
                            <span class="prefs-nav-icon">★</span>
                            <span>收藏</span>
                            <span class="prefs-nav-meta"><span class="prefs-nav-count" id="navFavoritesCount">0</span></span>
                        </button>
                        <button class="prefs-nav-item" type="button" data-prefs-section="history">
                            <span class="prefs-nav-icon">↺</span>
                            <span>历史</span>
                            <span class="prefs-nav-meta"><span class="prefs-nav-count" id="navHistoryCount">0</span></span>
                        </button>
                        <button class="prefs-nav-item" type="button" data-prefs-section="settings">
                            <span class="prefs-nav-icon">⚙</span>
                            <span>设置</span>
                            <span class="prefs-nav-meta"><span class="prefs-nav-count">配置</span></span>
                        </button>
                    </nav>
                    <div class="prefs-sidebar-foot" id="prefsSidebarNote">切换分类后，右侧会刷新出对应卡片。</div>
                </aside>

                <section class="prefs-main">
                    <div class="prefs-panel-head">
                        <div class="prefs-panel-copy">
                            <div class="prefs-panel-kicker" id="prefsSectionKicker">本地收藏</div>
                            <div class="prefs-panel-title" id="prefsSectionTitle">收藏</div>
                            <div class="prefs-panel-desc" id="prefsSectionDesc">查看你在当前浏览器保存的文章收藏，并可直接打开或删除单条记录。</div>
                        </div>
                        <div class="prefs-panel-tools">
                            <div class="prefs-toolbar">
                                <div class="prefs-search" id="prefsSearchWrap">
                                    <span>⌕</span>
                                    <input id="prefsSearchInput" type="search" placeholder="搜索收藏、历史、URL、章节或标签…">
                                </div>
                                <div class="prefs-mini-actions">
                                    <button class="prefs-btn secondary" id="refreshPrefsBtn">刷新列表</button>
                                    <button class="prefs-btn secondary" id="exportQuickBtn">导出 JSON</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="prefsSectionBody" class="prefs-content-grid"></div>
                </section>
            </div>
        </div>
    </main>

    <script src="../../js/site-data.js"></script>
    <script src="../../js/state-center.js"></script>
    <script src="../../js/page-state-adapter.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/darkmode.js"></script>
    <script src="../../js/cursor.js"></script>
</body>
</html>
