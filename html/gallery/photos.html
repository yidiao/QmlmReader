<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老照片 | 文艺 | 青年马列毛主义驿站</title>
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="../../favicon.ico">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/gallery/photos.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <main>
        <section class="page-header">
            <h1> 老照片</h1>
            <p class="ph-i01">摄影作品收录 · 岁月留影 · 时代见证</p>
        </section>

        <div class="gallery-container">
            <a href="gallery.html" class="back-link"> 返回文艺首页</a>

            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">照片总数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">--</div>
                    <div class="stat-label">年代跨度</div>
                </div>
            </div>

            <div class="filter-bar">
                <div class="filter-section">
                    <span class="filter-label">搜索标题 / 摄影师</span>
                    <input type="text" class="search-box" id="searchInput" placeholder="输入关键词搜索…">
                </div>
            </div>

            <div class="result-count" id="resultCount">共 0 张</div>

            <div class="gallery-grid" id="galleryGrid">
                <div class="empty-hint ph-i02" id="emptyHint">
                    <p class="ph-i03"> 暂无照片</p>
                    <p>将摄影作品放入以下路径即可自动显示：</p>
                    <div class="path-info">assets/photos/</div>
                    <p class="ph-i04">文件命名建议：<code>序号_年份_描述_摄影师.jpg</code></p>
                </div>
            </div>

            <div class="load-more">
                <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()">加载更多</button>
            </div>
        </div>
        <p class="ph-i05">——未完待续——</p>
    </main>

    <div class="modal" id="imageModal">
        <button class="modal-nav modal-prev" onclick="modalNav(-1)">&#10094;</button>
        <div class="modal-inner">
            <button class="modal-close" onclick="closeModal()" title="关闭(ESC)">&times;</button>
            <img class="modal-image" id="modalImage" src="" alt="">
            <div class="modal-info">
                <div class="modal-title" id="modalTitle"></div>
                <div class="modal-meta" id="modalMeta"></div>
                <div class="modal-counter" id="modalCounter"></div>
            </div>
        </div>
        <button class="modal-nav modal-next" onclick="modalNav(1)">&#10095;</button>
    </div>

    <footer class="site-footer">
        <div class="container">
            <p>青年马列毛主义驿站 | Qmlm Reader</p>
            <p class="footer-note">学习他 · 成为他 · 然后超越他</p>
        </div>
    </footer>

    <script src="../../js/site-data.js"></script>
    <script src="../../js/main.js"></script>
    <script>
    const BASE = '../assets/photos/';

    // 照片数据 —— 将文件放入 assets/photos/ 后，在此数组添加文件名即可
    // 命名建议：序号_年份_描述_摄影师.jpg
    const PHOTO_FILES = [
        // 示例（去掉注释并替换为实际文件名）：
        // "001_1949_开国大典群众游行_佚名.jpg",
        // "002_1950_劳动模范表彰大会_佚名.jpg",
    ];

    function parseFile(filename) {
        const parts = filename.replace(/\.(jpg|jpeg|png|webp)$/i,'').split('_');
        const year = parts[1] || '年代不详';
        const title = parts.slice(2, -1).join(' ') || filename;
        const author = parts[parts.length - 1] || '佚名';
        const src = BASE + filename;
        return { src, thumbSrc: src, title, year, author, filename };
    }

    const allData = PHOTO_FILES.map(f => parseFile(f));

    let searchKw = '';
    let filteredData = [];
    let displayedCount = 0;
    const PAGE_SIZE = 24;
    let modalIndex = 0;
    let imageObserver = null;

    function applyFilter() {
        const kw = searchKw.toLowerCase();
        filteredData = allData.filter(item => {
            if (!kw) return true;
            return item.title.toLowerCase().includes(kw) || item.author.toLowerCase().includes(kw);
        });
        displayedCount = 0;
        document.getElementById('galleryGrid').innerHTML = '';
        document.getElementById('resultCount').textContent = '共 ' + filteredData.length + ' 张';
        document.getElementById('totalCount').textContent = allData.length;
        document.getElementById('emptyHint').style.display = filteredData.length === 0 ? 'block' : 'none';
        initLazyLoader();
        loadMore();
    }

    function loadMore() {
        const grid = document.getElementById('galleryGrid');
        const end = Math.min(displayedCount + PAGE_SIZE, filteredData.length);
        for (let i = displayedCount; i < end; i++) {
            grid.appendChild(createCard(filteredData[i], i));
        }
        displayedCount = end;
        const btn = document.getElementById('loadMoreBtn');
        btn.disabled = displayedCount >= filteredData.length;
        btn.textContent = btn.disabled ? '已全部加载' : '加载更多（还剩 ' + (filteredData.length - displayedCount) + ' 张）';
        if (filteredData.length === 0) {
            btn.style.display = 'none';
        } else {
            btn.style.display = '';
        }
    }

    function createCard(item, idx) {
        const div = document.createElement('div');
        div.className = 'gallery-item';
        div.onclick = () => openModal(idx);
        div.innerHTML =
            '<img class="gallery-item-image lazy-placeholder" data-src="' + item.thumbSrc + '" alt="' + item.title.replace(/"/g, '&quot;') + '" onerror="this.classList.remove(\'lazy-placeholder\');this.style.background=\'#e8e8e8\';this.alt=\'图片加载失败\'">' +
            '<div class="gallery-item-info">' +
            '<div class="gallery-item-title">' + item.title + '</div>' +
            '<div class="gallery-item-meta">' +
            '<span>' + item.year + '</span>' +
            '<span>' + (item.author !== '佚名' ? item.author : '') + '</span>' +
            '</div></div>';
        const img = div.querySelector('img');
        if (imageObserver) imageObserver.observe(img);
        return div;
    }

    function initLazyLoader() {
        if (imageObserver) imageObserver.disconnect();
        imageObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    const src = img.dataset.src;
                    if (src) {
                        const tempImg = new Image();
                        tempImg.onload = () => {
                            img.src = src;
                            img.classList.remove('lazy-placeholder');
                            img.classList.add('loaded');
                        };
                        tempImg.onerror = () => {
                            img.classList.remove('lazy-placeholder');
                            img.style.background = '#e8e8e8';
                            img.alt = '图片加载失败';
                        };
                        tempImg.src = src;
                    }
                    imageObserver.unobserve(img);
                }
            });
        }, { rootMargin: '100px 0px', threshold: 0.01 });
    }

    function openModal(idx) {
        modalIndex = idx;
        renderModal();
        document.getElementById('imageModal').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('imageModal').classList.remove('active');
        document.body.style.overflow = '';
    }

    function renderModal() {
        const item = filteredData[modalIndex];
        const modalImg = document.getElementById('modalImage');
        modalImg.classList.remove('loaded');
        modalImg.classList.add('loading');
        modalImg.removeAttribute('src');
        const tempImg = new Image();
        tempImg.onload = () => {
            modalImg.src = item.src;
            modalImg.classList.remove('loading');
            modalImg.classList.add('loaded');
        };
        tempImg.onerror = () => {
            modalImg.classList.remove('loading');
            modalImg.alt = '图片加载失败';
        };
        tempImg.src = item.src;
        document.getElementById('modalTitle').textContent = item.title;
        document.getElementById('modalMeta').textContent = item.year + (item.author !== '佚名' ? ' · ' + item.author : '');
        document.getElementById('modalCounter').textContent = (modalIndex + 1) + ' / ' + filteredData.length;
    }

    function modalNav(dir) {
        const next = modalIndex + dir;
        if (next >= 0 && next < filteredData.length) {
            modalIndex = next;
            renderModal();
            if (modalIndex >= displayedCount - 3) loadMore();
        }
    }

    document.addEventListener('keydown', e => {
        if (!document.getElementById('imageModal').classList.contains('active')) return;
        if (e.key === 'Escape') closeModal();
        if (e.key === 'ArrowLeft') modalNav(-1);
        if (e.key === 'ArrowRight') modalNav(1);
    });
    document.getElementById('imageModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    let searchTimer;
    document.getElementById('searchInput').addEventListener('input', function() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            searchKw = this.value.trim();
            applyFilter();
        }, 300);
    });

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode') ? 'true' : 'false');
        document.querySelector('.dark-mode-toggle').textContent =
            document.body.classList.contains('dark-mode') ? '' : '';
    }
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
        const btn = document.querySelector('.dark-mode-toggle');
        if (btn) btn.textContent = '';
    }

    initLazyLoader();
    applyFilter();
    </script>

<script src="../../js/darkmode.js"></script>
<script src="../../js/cursor.js"></script>
</body>
</html>
